# Baseline RF+SVM Classification Experiment
# Standard Apollo methodology on real data without synthetic augmentation

name: baseline_exp_001
description: "Baseline Apollo RF+SVM classification on real glioma data (no synthetic augmentation)"
version: "1.0"

# Preprocessing Configuration
preprocessing:
  # AirPLS baseline correction
  airpls_lambda: 100        # Strength of baseline correction
  airpls_porder: 1          # Polynomial order

  # Spectral dimensions
  signal_length: 1738       # Full spectral dimension
  crop_region: [700, 1800]  # Fingerprint region for cropping

  # Quality filtering
  ignore_samples: []        # No samples to ignore

# Cross-Validation Strategy
cv_strategy:
  split_source: "data/splits/strict_splits.json"  # Group-aware CV splits
  use_group_aware_cv: true  # Enforce patient-level grouping
  holdout_test_set: true    # Use separate held-out test set for final metrics
  n_folds: 5                # Number of CV folds

# Model Hyperparameters
models:
  # Random Forest for feature selection
  random_forest:
    n_estimators: 300
    max_depth: 10
    criterion: "entropy"
    min_samples_leaf: 50
    min_samples_split: 50
    random_state: 42

  # SVM classifier on selected features
  svm:
    C: 1.0
    kernel: "rbf"
    gamma: "scale"
    probability: true
    random_state: 42

  # Feature selection
  feature_selection:
    n_features: 20
    method: "mutual_info"

  # CVAE (not used in baseline, but documented for consistency)
  cvae:
    batch_size: 256
    epochs: 45
    learning_rate: 0.001
    latent_dim: 32
    beta: 2.0
    random_state: 42
    validation_split: 0.1

# Output Configuration
output:
  output_base: "baseline_exp_001"     # Creates results/baseline_exp_001/
  h5_filename: "glioma_dataset.h5"    # Dataset file name
  include_experiment_name_in_output: false
  save_intermediate: false
  verbosity: "info"
