# Comprehensive Experiment Pipeline: TRTR → CVAE → TSTR → Stats
# Tests all spectra (y_tumor=false) with synthetic augmentation

name: exp_101
description: "Complete pipeline: Real data (TRTR) + synthetic (CVAE) + test on synthetic (TSTR) + statistical evaluation"
version: "1.0"

# ============================================================================
# DATA PATHS
# ============================================================================
paths:
  # Data sources (shared, input-only)
  data_root: "data"
  raw_data_dir: "data/raw"
  processed_dir: "data/processed"
  processed_file: "data/processed/glioma_dataset.h5"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/strict_splits.json"
  presentation_dir: "presentation"
  
  # Experiment outputs (consolidated under exp_101)
  results_root: "results"
  experiment_root: "results/exp_101"
  models_baseline_dir: "results/exp_101/models/baselines"      # TRTR models
  models_tstr_dir: "results/exp_101/models/tstr"               # TSTR models
  models_cvae_dir: "results/exp_101/models/cvae"               # CVAE weights
  synthetic_dir: "results/exp_101/synthetic"
  quality_dir: "results/exp_101/data_quality"
  statistical_dir: "results/exp_101/statistical_eval"

# ============================================================================
# PREPROCESSING CONFIGURATION
# ============================================================================
preprocessing:
  # AirPLS baseline correction
  airpls_lambda: 100
  airpls_porder: 1

  # Spectral dimensions
  signal_length: 1738
  crop_region: null         # Full spectrum, no cropping

  # Data filtering
  y_tumor: false            # false: use ALL spectra | true: tumor-only
  ignore_samples: ['HF-1887_via-t_2_1.h5_3']

  # Annotation (for 01_Annotator)
  annotator:
    algorithm: "gmm"
    pca_variance: 0.99
    spatial_weight: 2.0

# ============================================================================
# CROSS-VALIDATION STRATEGY
# ============================================================================
cv_strategy:
  split_source: "data/splits/strict_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5

# ============================================================================
# MODEL HYPERPARAMETERS
# ============================================================================
models:
  # Apollo: RF feature selector + SVM (TRTR & TSTR)
  apollo:
    n_features: 20
    random_state: 42

  # Random Forest (TRTR & TSTR)
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  # XGBoost (TRTR & TSTR)
  xgboost:
    objective: "multi:softprob"
    num_class: 6
    random_state: 42
    n_jobs: -1
    tree_method: "hist"

  # 1D-CNN (TRTR & TSTR)
  cnn:
    input_shape: [1738, 1]
    num_classes: 6
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 30
    early_stopping_patience: 5
    random_state: 42

  # CVAE for synthetic data generation (03_Synthetic_CVAE)
  cvae:
    batch_size: 256
    epochs: 70
    learning_rate: 0.001
    latent_dim: 32
    beta: 2.0
    alpha: 0.2
    validation_split: 0.1
    random_state: 42
    
    # Architecture
    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    
    decoder:
      initial_filters: 128
      filters: [64, 32, 16]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]
    
    # Synthetic data generation
    samples_per_class: 20000  # ~120k total synthetic
    num_classes: 6

# ============================================================================
# TSTR CONFIGURATION
# ============================================================================
tstr:
  sleep_before_training: 0     # seconds (for remote scheduling)

# ============================================================================
# STATISTICAL EVALUATION
# ============================================================================
statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  output_base: "exp_101"
  h5_filename: "glioma_dataset.h5"
  include_experiment_name_in_output: true
  save_intermediate: true
  verbosity: "info"

# ============================================================================
# EXPERIMENT NOTES
# ============================================================================
notes: |
  exp_101: NMF + GMM preprocessing → Baseline TRTR → CVAE synthetic generation → TSTR on synthetic → Statistical evaluation (bootstrap)
  - Preprocessing: Cosmic Ray Removal, Normalization, NMF + GMM for tumor mask annotation 
  - TRTR: Train on real data, test on real data (strict patient splits, full dataset)
  - CVAE: Generate synthetic spectra (20k per class) using real data distribution 
  - TSTR: Train on real + synthetic, test on synthetic (holdout patients)
  - Statistical evaluation: Patient-level bootstrap comparing TRTR vs TSTR on real test set (
  