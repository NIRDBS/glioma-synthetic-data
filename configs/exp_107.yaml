# Patient-First TSAR Architecture: Fingerprint Cropping, Patient Balancing, and On-the-Fly Augmentation

name: exp_107
description: "TSAR Regimen: Fingerprint crop (700-1800), patient cap (500), and dynamic Raman augmentation"
version: "1.0"

# ============================================================================
# DATA PATHS
# ============================================================================
paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/strict_splits.json"
  
  # Reuse preprocessed data from exp_102 (identical preprocessing, cropping/cap at load time)
  results_root: "results"
  experiment_root: "results/exp_107"
  data_output_dir: "results/exp_107/data"
  processed_file: "results/exp_102/data/glioma_dataset.h5"  # Shared with exp_102

# Model outputs
  models_baseline_dir: "results/exp_107/models/baselines"
  models_tstr_dir: "results/exp_107/models/tstr"
  models_cvae_dir: "results/exp_107/models/cvae"
  synthetic_dir: "results/exp_107/synthetic"
  quality_dir: "results/exp_107/data_quality"
  statistical_dir: "results/exp_107/statistical_eval"


# ============================================================================
# PREPROCESSING CONFIGURATION
# ============================================================================
preprocessing:
  # Spatial smoothing
  spatial_median_filter: true           
  spatial_median_filter_size: 3         
  
  # Baseline Correction
  airpls_lambda: 100                    
  airpls_porder: 1                      
  
  # Normalization
  normalization: "minmax"               

  # ========== EXP 103 NEW DATA SELECTION ==========
  signal_length: 1738
  crop_region: [700, 1800]              # Focus EXCLUSIVELY on the fingerprint region
  # NOTE: patient_cap moved to cv_strategy (dynamic sampling during training, not preprocessing)
  y_tumor: true                         
  ignore_samples: ['HF-1887_via-t_2_1.h5_3']

  # Tumor Mask Strategy
  mask_strategy: "tumor_map"
  tumor_maps_path: "results/exp_102/tumor_maps.npy"  # Reuse the masks from exp_102 to save time
  use_precomputed_masks: true

# ============================================================================
# DYNAMIC AUGMENTATION (NEW FOR EXP 103)
# ============================================================================
augmentation:
  enabled: true
  max_shift: 3                          # Wavenumber shift for calibration drift simulation
  mixup_alpha: 0.2                      # Beta distribution parameter for intra-class blending

# ============================================================================
# CROSS-VALIDATION STRATEGY
# ============================================================================
cv_strategy:
  split_source: "data/splits/strict_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  # ========== EXP 103 DYNAMIC SAMPLING ==========
  patient_cap: 500  # Max spectra per slide; applied to the TRAINING split only
  cap_strategy: "dynamic_per_epoch"  # CVAE: fresh subsample each epoch (regularisation). Classifiers: one fixed subsample. Descriptive only - code reads patient_cap, not this key.

# ============================================================================
# TRAINING EXECUTION PARAMETERS
# ============================================================================
training:
  random_seed: 42                       # Global seed for reproducibility (numpy, TensorFlow, random)
  verbose: 1                            # Verbosity level (0=silent, 1=progress, 2=detailed)

# ============================================================================
# MODEL HYPERPARAMETERS
# ============================================================================
models:
  # Apollo: RF feature selector + SVM (TRTR & TSTR)
  apollo:
    n_features: 20
    random_state: 42

  # Random Forest (TRTR & TSTR)
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  # XGBoost (TRTR & TSTR)
  xgboost:
    objective: "multi:softprob"
    num_class: 6
    random_state: 42
    n_jobs: -1
    tree_method: "hist"

  # 1D-CNN (TRTR & TSTR)
  cnn:
    input_shape: [1738, 1]
    num_classes: 6
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 30
    early_stopping_patience: 5
    random_state: 42
    dropout_rate: 0.6  # Increased dropout for stronger regularization given the dynamic patient capping

  cvae:
    batch_size: 256
    epochs: 220
    learning_rate: 0.005
    latent_dim: 32  
    loss_weights:
      alpha: 0.5  # classification loss weight
      beta: 2.0  # KL divergence weight
      gamma: 0.1 # mse weight
      delta: 0.9 # cosine weight
    validation_split: 0.1
    random_state: 42
    reconstruction_loss_mode: "combined"
    
    annealing:
      enabled: true
      alpha:
        warmup_epochs: 30
        start_epoch: 70
      beta:
        warmup_epochs: 110
        start_epoch: 10

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [64, 32, 16]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]
    classifier_branch: "latent_z"  # Move classification head to latent space for better class separation in latent representation

    samples_per_class: 20000

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================
output:
  output_base: "results"
  include_experiment_name_in_output: true

# ============================================================================
# Notes
# ============================================================================
notes: |
  - Preprocessing: 3x3 spatial median filter for noise reduction (filters cosmic rays, as well as gaussian noise)
  - Baseline correction using Asymmetric Least Squares (airPLS) with λ=100 and p=1 for effective background removal
  - Crop spectra to 700-1800 cm⁻¹ to focus on the fingerprint region, which is most informative for glioma classification
  - Number of spectra capping at 500 per patient before training to prevent overfitting to dominant patients and enhance generalization
  - Augmentation only for CVAE: random wavenumber shifts (±3 cm⁻¹) to simulate calibration drift and mixup within the same class to create synthetic spectra
  - CVAE trained on spectra capped at 500 per patient, with samples drawn at each epoch
  - Annealing the KL divergence weight (beta) from 0 to 2 over the first 80 epochs to encourage better latent space structuring without overwhelming the reconstruction loss early on
  - Adjusted the combined loss weights to prioritize cosine similarity more heavily, which empirically encourages better class separation in the latent space while still maintaining reconstruction quality through the MSE component.
  - Moving classification output post latent space to encourage the model to learn class-discriminative features in the latent representation, which might be useful for generating synthetic samples for TSTR evaluation