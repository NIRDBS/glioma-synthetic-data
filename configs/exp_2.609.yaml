# v2-preprocessing replication of exp_609 (Suite 600, flat beta=0.75): same
# model/training settings throughout, but reading data/processed/glioma-preproc-2.h5
# (src/data/preprocessing_v2.py -- no NMF/GMM/manual curation, a different
# per-slide strong-signal mask) instead of the v1 dataset. The dataset changed
# at the instance level, so NOTHING is reused from exp_609 or any other prior
# experiment: own TRTR (full retrain), own CVAE, own everything. Completes the
# v2 beta sweep alongside exp_2.607 (beta=0.25) and exp_2.608 (beta=0.5).
name: exp_2.609
description: "v2-preprocessing replication of exp_609: same settings (beta=0.75, 120 epochs), new dataset (glioma-preproc-2.h5), full retrain -- nothing transferred"
version: "1.0"

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_2.609"
  data_output_dir: "results/exp_2.609/data"
  processed_file: "data/processed/glioma-preproc-2.h5"   # <-- the only dataset-level change

  models_baseline_dir: "results/exp_2.609/models/trtr"   # OWN TRTR -- nothing to reuse, dataset changed
  models_tstr_dir: "results/exp_2.609/models/tstr"
  models_tsrtr_dir: "results/exp_2.609/models/tsrtr"
  models_cvae_dir: "results/exp_2.609/models/cvae"
  synthetic_dir: "results/exp_2.609/synthetic"
  quality_dir: "results/exp_2.609/data_quality"
  statistical_dir: "results/exp_2.609/statistical_eval"

tsrtr:
  synth_ratio: 1.0
  cvae_weights_dir: "results/exp_2.609/models/cvae"

pipeline:
  stages: [trtr, cvae, tstr, tsrtr, stats_eval]

preprocessing:
  spatial_median_filter: true
  spatial_median_filter_size: 3
  airpls_lambda: 10000
  airpls_porder: 1
  normalization: "minmax"
  signal_length: 1738
  crop_region: [700, 1800]
  y_tumor: false
  ignore_samples: []

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  patient_cap: 500
  cap_strategy: "dynamic_per_epoch"

training:
  random_seed: 42
  verbose: 1

models:
  apollo:
    n_features: 20
    random_state: 42
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    objective: "binary:logistic"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
    num_classes: 2
  cnn:
    input_shape: [null, 1]
    num_classes: 2
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 200
    early_stopping_patience: 20
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6
    backend: "modal"   # CNN only -- Apollo/RF/XGBoost still train locally (fast on CPU)

  cvae:
    num_classes: 2
    batch_size: 256
    epochs: 120
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.2
      beta: 0.75   # matches exp_609 exactly
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 20000

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001
  bayes: {}   # defaults: pca_components=10, n_chains=3, n_iter=600, burn_in=200, thin=5

output:
  output_base: "results"
  include_experiment_name_in_output: true

notes: |
  - Direct replication of exp_609 (flat beta=0.75, 120 epochs) on the new
    v2-preprocessing dataset (glioma-preproc-2.h5): no NMF/GMM clustering, no
    manual tumour-cluster curation, a different adaptive per-slide
    strong-signal mask (src/data/preprocessing_v2.py). Same 59 slides, same
    CV split (data/splits/manual_splits.json is keyed by slide name, which is
    unchanged between v1/v2), same model hyperparameters throughout.
  - Completes the v2 beta sweep: exp_2.607 (beta=0.25), exp_2.608 (beta=0.5),
    exp_2.609 (beta=0.75) -- same relationship as the v1 trio (607/608/609).
  - TRTR is OWN, not reused -- the instance-level data changed (different
    pixels survive the mask, different per-spectrum baseline-corrected
    values), so exp_501's, exp_609's, or exp_2.608's TRTR models are not
    valid references for this dataset.
  - This dataset's HDF5 has no tissue_cluster/viable_legacy columns (v2 has
    no clustering stage at all) -- Tier 2 (EM, which reads tissue_cluster)
    and the spatial-validation script's external-agreement check (which
    reads viable_legacy) are not applicable here without further work; Tier 1
    (mi-SVM) does not use tissue_cluster and is unaffected.
  - MIL tiers requested: Tier 1 (mi-svm), Tier 3 (attention), Tier 4 (cbr),
    Tier 5 (bayes_mil) -- run via pipeline/mil_fit_stage.py,
    pipeline/mil_attention_stage.py directly, same as exp_2.607/2.608's own
    Tier 3/4 runs (mil_fit/mil_eval deliberately excluded from
    pipeline.stages above, consistent with every other Suite 600 config).
  - Per the Tier 1/5 dataset-level finding confirmed for exp_2.607/exp_2.608
    (docs/experiment_inventory.md §4.3): Tier 1 (mi-SVM) and Tier 5
    (Bayesian) depend only on raw spectra/PCA, not beta -- if exp_2.608's
    fit completes first, confirm bit-identity before refitting Tier 1/5 here
    rather than assuming it (same verification discipline as 2.607 vs 2.608).
