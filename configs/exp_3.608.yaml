# Exploratory: same model/training settings as exp_608 (Suite 600, flat
# beta=0.5), but reading the v1 dataset (glioma_mil.h5) restricted to the old,
# narrower, manually-curated "tumour cluster" subset (viable_legacy==True --
# NMF(100)->GMM(3) per slide, human-picked cluster; src/data/preprocessing.py).
# This is a strict INSTANCE SUBSET of exp_608's training data (227,344/288,678
# spectra, 78.8% -- see loader's viable_legacy_only filter, src/data/loader.py),
# not a new preprocessing pipeline. Purpose: does restricting to the old,
# more-conservative tumour mask change anything, as a cheap ablation before
# committing to any further work in this direction (per-user request,
# exploratory). The dataset changed at the instance level, so NOTHING is
# reused from exp_608 or exp_501: own TRTR (full retrain), own CVAE, own
# everything, and every MIL tier needs its own retrain too.
name: exp_3.608
description: "viable_legacy ablation of exp_608: same settings (beta=0.5, 120 epochs), training restricted to the legacy manually-curated tumour-cluster subset -- exploratory"
version: "1.0"

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_3.608"
  data_output_dir: "results/exp_3.608/data"
  processed_file: "data/processed/glioma_mil.h5"   # same v1 h5 as exp_608 -- the filter is applied at load time

  models_baseline_dir: "results/exp_3.608/models/trtr"   # OWN TRTR -- nothing to reuse, training set changed
  models_tstr_dir: "results/exp_3.608/models/tstr"
  models_tsrtr_dir: "results/exp_3.608/models/tsrtr"
  models_cvae_dir: "results/exp_3.608/models/cvae"
  synthetic_dir: "results/exp_3.608/synthetic"
  quality_dir: "results/exp_3.608/data_quality"
  statistical_dir: "results/exp_3.608/statistical_eval"

tsrtr:
  synth_ratio: 1.0
  cvae_weights_dir: "results/exp_3.608/models/cvae"

pipeline:
  stages: [trtr, cvae, tstr, tsrtr, stats_eval]

preprocessing:
  spatial_median_filter: true
  spatial_median_filter_size: 3
  airpls_lambda: 10000
  airpls_porder: 1
  normalization: "minmax"
  signal_length: 1738
  crop_region: [700, 1800]
  y_tumor: false
  viable_legacy_only: true   # <-- THE ABLATED SETTING: restrict to the legacy tumour-cluster mask
  ignore_samples: []

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  patient_cap: 500
  cap_strategy: "dynamic_per_epoch"

training:
  random_seed: 42
  verbose: 1

models:
  apollo:
    n_features: 20
    random_state: 42
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    objective: "binary:logistic"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
    num_classes: 2
  cnn:
    input_shape: [null, 1]
    num_classes: 2
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 200
    early_stopping_patience: 20
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6
    backend: "modal"   # CNN only -- Apollo/RF/XGBoost still train locally (fast on CPU)

  cvae:
    num_classes: 2
    batch_size: 256
    epochs: 120
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.2
      beta: 0.5   # matches exp_608 exactly
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 20000

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001
  bayes: {}   # defaults: pca_components=10, n_chains=3, n_iter=600, burn_in=200, thin=5

output:
  output_base: "results"
  include_experiment_name_in_output: true

notes: |
  - Exploratory ablation requested directly: "same config as 608 except the
    viable_legacy flag activated" -- isolates whether restricting training to
    the old, narrower, manually-curated tumour-cluster subset changes
    anything, before committing further effort to this direction.
  - Implementation: new `preprocessing.viable_legacy_only` config key, read by
    `GliomaDataLoader.from_config` (src/data/loader.py), filters self.X/y/
    groups/coords/tissue_cluster to viable_legacy==True right after load,
    before the CV split (which is keyed by slide name via manual_splits.json
    and is unaffected -- no slide loses all its instances: per-slide
    viable_legacy counts range 865-14536, min well above any fold's needs).
  - Same v1 h5 (glioma_mil.h5) as exp_608 -- NOT a new preprocessing pipeline
    like v2 (exp_2.608). Instance count: 227,344/288,678 (78.8%) survive the
    filter; binary class balance is close to even (114,826/112,518) --
    tighter than the full dataset's 162,742/125,936.
  - TRTR is OWN, not reused from exp_501 or exp_608 -- the training instances
    themselves changed, so neither is a valid reference for this dataset.
  - MIL tiers requested: Tier 1 (mi-svm), Tier 3 (attention), Tier 4 (cbr),
    Tier 5 (bayes_mil) -- all need their own retrain (every formulation fits
    on raw spectra/CVAE latents derived from this filtered instance set).
    Tier 2 (EM) reads tissue_cluster, which v1 still has here (unlike v2) --
    include if/when Tier 2 is revisited project-wide.
  - Full Family A (spatial) + Family B (key-instance) validation suite
    planned once the base suite + MIL tiers land, mirroring exp_2.607/
    exp_2.608's coverage.
