# alpha=0 ablation of exp_501's CVAE (docs/counterfactual_probe.md §5): the ONLY
# change from exp_501.yaml is models.cvae.loss_weights.alpha, 0.2 -> 0.0, removing
# the auxiliary class head's gradient pressure on the shared encoder features that
# also produce z_mean (src/models/cvae.py:78,79,91 -- confirmed at total_loss =
# recon_loss + beta*kl_loss + alpha*class_loss, cvae.py:169, one combined
# tape.gradient call, so alpha=0 is a clean, complete removal, not a partial one).
# Tests whether the counterfactual probe's z-class-probe result (landed at exactly
# encoder_head's 0.7966 bag accuracy) and its flip-to-target finding depend on this
# head's pressure on z, or would appear the same without it.
#
# experiment_root/paths are IDENTICAL to exp_501 on purpose -- this reuses the same
# dataset and directory tree; only the CVAE's own output paths get redirected, via
# pipeline/modal_cvae.py's store_suffix='alpha0' mechanism (already generic, no code
# change needed), to results/exp_501/models/cvae_alpha0/ and
# results/exp_501/data/synthetic_alpha0/ -- never touching the real cvae/ or
# cvae_shuffled/ weights.
name: exp_501_alpha0
description: "alpha=0 ablation of exp_501's CVAE -- ONLY alpha changed, see counterfactual_probe.md §5"
version: "1.0"

# ============================================================================
# DATA PATHS -- identical to exp_501; store_suffix handles CVAE output redirection
# ============================================================================
paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_501"
  data_output_dir: "results/exp_501/data"
  processed_file: "data/processed/glioma_mil.h5"

  models_baseline_dir: "results/exp_501/models/trtr"
  models_tstr_dir: "results/exp_501/models/tstr"
  models_tsrtr_dir: "results/exp_501/models/tsrtr"
  models_cvae_dir: "results/exp_501/models/cvae"
  synthetic_dir: "results/exp_501/synthetic"
  quality_dir: "results/exp_501/data_quality"
  statistical_dir: "results/exp_501/statistical_eval"

tsrtr:
  synth_ratio: 1.0
  cvae_weights_dir: "results/exp_501/models/cvae"

pipeline:
  stages: [trtr, cvae, tstr, tsrtr, stats_eval, mil_eval, mil_fit]

# ============================================================================
# PREPROCESSING CONFIGURATION -- identical to exp_501
# ============================================================================
preprocessing:
  spatial_median_filter: true
  spatial_median_filter_size: 3

  airpls_lambda: 10000  # actually IARPLS lambda; see docs/stage1_data_layer.md §3
  airpls_porder: 1

  normalization: "minmax"

  signal_length: 1738
  crop_region: [700, 1800]

  y_tumor: false
  ignore_samples: []

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  patient_cap: 500
  cap_strategy: "dynamic_per_epoch"

training:
  random_seed: 42
  verbose: 1

# ============================================================================
# MODEL HYPERPARAMETERS -- identical to exp_501, EXCEPT cvae.loss_weights.alpha
# ============================================================================
models:
  apollo:
    n_features: 20
    random_state: 42

  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  xgboost:
    objective: "binary:logistic"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
    num_classes: 2

  cnn:
    input_shape: [null, 1]
    num_classes: 2
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 100
    early_stopping_patience: 10
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6

  cvae:
    num_classes: 2
    batch_size: 256
    epochs: 100
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.0    # <-- THE ONLY CHANGE FROM exp_501.yaml (was 0.2)
      beta: 2.0
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 20000

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001

output:
  output_base: "results"
  include_experiment_name_in_output: true

notes: |
  - alpha=0 ablation of exp_501's CVAE, for the counterfactual probe's validity
    check (docs/counterfactual_probe.md §5) -- every other key is byte-identical
    to configs/exp_501.yaml. Do not use this config for anything other than
    training the alpha=0 CVAE variant (via store_suffix='alpha0'); it shares
    exp_501's experiment_root and would silently collide with real exp_501
    outputs for any stage other than 'cvae' run through the suffix mechanism.
