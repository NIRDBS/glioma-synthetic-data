# Suite 660: the 6-class (LGm1-6) counterpart of Suite 600's binary runs.
# exp_661 is a single EXPLORATORY run, not a sweep -- beta=0.5 is carried over
# from exp_608, one of the two best-performing binary configurations
# (docs/beta_sweep_findings.md: significant TSRTR Apollo gain, best-equal CbR
# bag accuracy at 0.780).
#
# Purpose: produce a real 6-class confusion matrix from the CURRENT pipeline
# (59 slides, corrected CNN settings, bag-level metrics) so that a coarser
# class grouping can be chosen from observed confusions rather than assumed.
# Every existing 6-class result in this repo (exp_101-104/107-108, exp_204-206)
# predates the 59-slide split fix AND the MIL reframe's bag-level evaluation
# correction, so none of them can serve that purpose.
#
# Known statistical limitation, stated up front: at K=6 the 59 bags split
# 5/12/9/13/15/5 (LGm1 and LGm6 have FIVE bags each, ~1 per fold). Bag-level
# accuracy and its class-stratified bootstrap are therefore very low-powered
# here -- this run is diagnostic (what gets confused with what), not a basis
# for significance claims.
#
# Differs from exp_608 ONLY in: the 6-class switches (models.cnn.num_classes,
# models.cvae.num_classes, models.xgboost objective/num_class) and TRTR, which
# CANNOT be reused from exp_501 -- that baseline is binary-trained, so this
# experiment trains its own.
name: exp_661
description: "Suite 660: 6-class exploratory run, flat beta=0.5, 120 epochs, full suite (own TRTR -- exp_501's is binary)"
version: "1.0"

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_661"
  data_output_dir: "results/exp_661/data"
  processed_file: "data/processed/glioma_mil.h5"

  models_baseline_dir: "results/exp_661/models/trtr"   # OWN TRTR -- exp_501's is binary, not reusable here
  models_tstr_dir: "results/exp_661/models/tstr"
  models_tsrtr_dir: "results/exp_661/models/tsrtr"
  models_cvae_dir: "results/exp_661/models/cvae"
  synthetic_dir: "results/exp_661/synthetic"
  quality_dir: "results/exp_661/data_quality"
  statistical_dir: "results/exp_661/statistical_eval"

tsrtr:
  synth_ratio: 1.0
  cvae_weights_dir: "results/exp_661/models/cvae"

pipeline:
  stages: [trtr, cvae, tstr, tsrtr, stats_eval]

preprocessing:
  spatial_median_filter: true
  spatial_median_filter_size: 3
  airpls_lambda: 10000
  airpls_porder: 1
  normalization: "minmax"
  signal_length: 1738
  crop_region: [700, 1800]
  y_tumor: false
  ignore_samples: []

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  patient_cap: 500
  cap_strategy: "dynamic_per_epoch"

training:
  random_seed: 42
  verbose: 1

models:
  apollo:
    n_features: 20
    random_state: 42
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    objective: "multi:softprob"   # 6-class: NOT binary:logistic
    num_class: 6                  # the key pipeline/_common.py actually reads (num_class, singular)
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
  cnn:
    input_shape: [null, 1]
    num_classes: 6                # the master task switch -- pipeline/_common.py::num_classes_of reads this
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 200
    early_stopping_patience: 20
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6
    backend: "modal"   # CNN only -- Apollo/RF/XGBoost still train locally (fast on CPU)

  cvae:
    num_classes: 6
    batch_size: 256
    epochs: 120
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.2
      beta: 0.5    # carried over from exp_608 (binary), not re-tuned for K=6
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 20000   # per class -> 120k synthetic instances at K=6, vs 40k at K=2

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001

output:
  output_base: "results"
  include_experiment_name_in_output: true

notes: |
  - Exploratory, single run. Its job is a trustworthy 6-class confusion matrix
    from the current pipeline, to inform whether a coarser grouping of the
    LGm1-6 labels is worth pursuing (merging classes that are reliably
    confused) rather than committing to a full 6-class sweep.
  - beta=0.5 is inherited from the binary sweep, NOT tuned for K=6. The CVAE
    conditions on 6 one-hot classes here instead of 2, so the collapse
    behaviour that motivated the beta sweep may differ; treat any CVAE-side
    diagnostic from this run as a first look, not a transfer of the binary
    result.
  - samples_per_class is unchanged at 20000, which means the synthetic pool is
    3x larger than the binary runs' (120k vs 40k) and TSTR/TSRTR training sets
    grow accordingly -- expect longer classifier stages than exp_607-609.
  - mil_eval/mil_fit deliberately excluded, same as exp_607-609: Tiers 1-4 all
    failed to beat Tier 0 on the binary task (docs/beta_sweep_findings.md §4),
    so there is no reason to spend them on a lower-powered 6-class variant.
