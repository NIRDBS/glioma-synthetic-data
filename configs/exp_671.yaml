# Suite 670: intra-mutant LGm subtype classification, LGm1 vs {LGm2, LGm3}.
#
# Clinical framing: a two-stage pipeline -- stage 1 is the existing IDH
# mutant-vs-wildtype task (exp_501/607-609/2.608); stage 2, run only when
# stage 1 calls IDH-mutant, asks which LGm subtype (1/2/3) the slide is.
# This experiment is stage 2's first binary decomposition: LGm1 vs rest.
# exp_672 (LGm2 vs rest) and exp_673 (LGm3 vs rest) are the planned
# siblings -- trivial copies of this file, built from
# data/processed/glioma_mil_lgm{2,3}_vs_rest.h5 (see
# scripts/build_glioma_mil_lgm_subtype.py --positive-class {1,2}).
#
# Dataset: NOT glioma_mil.h5 (the full 59-slide population). Built by
# scripts/build_glioma_mil_lgm_subtype.py, which filters to the IDH-mutant
# subset (LGm1/2/3, 26 of the 59 slides) and pre-bakes the binary label
# directly into y_bag -- no pipeline code was changed to support this; the
# existing nc==2 rule in pipeline/_common.py (np.where(y<3,0,1)) already
# produces the correct label from this file's deliberate {0,3} encoding.
# See that script's docstring and this file's own HDF5 attrs for the exact
# mapping.
#
# TRTR/CVAE are trained from scratch, own to this experiment -- cannot
# reuse exp_501/608's TRTR (different population: 26 slides not 59, AND a
# different label definition: LGm1-vs-rest, not mutant-vs-wildtype).
#
# Same beta=0.5, 120-epoch CVAE settings as exp_608, NOT re-tuned for this
# task -- same inherited-not-tuned caveat as exp_661's beta=0.5 choice.
name: exp_671
description: "Suite 670: intra-mutant subtype, LGm1 vs {LGm2,LGm3} (own TRTR/CVAE, beta=0.5 inherited from exp_608)"
version: "1.0"

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_671"
  data_output_dir: "results/exp_671/data"
  processed_file: "data/processed/glioma_mil_lgm1_vs_rest.h5"

  models_baseline_dir: "results/exp_671/models/trtr"   # OWN TRTR -- different population+label, not reusable
  models_tstr_dir: "results/exp_671/models/tstr"
  models_tsrtr_dir: "results/exp_671/models/tsrtr"
  models_cvae_dir: "results/exp_671/models/cvae"
  synthetic_dir: "results/exp_671/synthetic"
  quality_dir: "results/exp_671/data_quality"
  statistical_dir: "results/exp_671/statistical_eval"

tsrtr:
  synth_ratio: 1.0
  cvae_weights_dir: "results/exp_671/models/cvae"

pipeline:
  stages: [trtr, cvae, tstr, tsrtr, stats_eval]

preprocessing:
  spatial_median_filter: true
  spatial_median_filter_size: 3
  airpls_lambda: 10000
  airpls_porder: 1
  normalization: "minmax"
  signal_length: 1738
  crop_region: [700, 1800]
  y_tumor: false
  ignore_samples: []

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  use_group_aware_cv: true
  holdout_test_set: true
  n_folds: 5
  patient_cap: 500
  cap_strategy: "dynamic_per_epoch"

training:
  random_seed: 42
  verbose: 1

models:
  apollo:
    n_features: 20
    random_state: 42
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    objective: "binary:logistic"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
    num_classes: 2
  cnn:
    input_shape: [null, 1]
    num_classes: 2
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 200
    early_stopping_patience: 20
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6
    backend: "modal"   # CNN only -- Apollo/RF/XGBoost still train locally (fast on CPU)

  cvae:
    num_classes: 2
    batch_size: 256
    epochs: 120
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.2
      beta: 0.5   # inherited from exp_608, NOT re-tuned for this task
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 20000

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42
  primary_metric: "f1_macro"

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001

output:
  output_base: "results"
  include_experiment_name_in_output: true

notes: |
  - Severe statistical power limitation, stated up front (same root cause as
    exp_661's documented LGm1/LGm6 5-bag floor, now the primary subject
    rather than a side note): the IDH-mutant subset is only 26 of the 59
    slides (LGm1=5, LGm2=12, LGm3=9), and LGm1 (the positive class here)
    has exactly 5 bags total. Checked directly against manual_splits.json:
    every one of the 5 folds has EXACTLY 1 LGm1 bag in its held-out test
    set (never 0, so no fold is degenerate) -- but per-fold recall for the
    positive class is necessarily binary (0 or 1), and the pooled test set
    across all 5 folds only ever has 5 positive decisions out of 26.
    Bag-level accuracy and its bootstrap CI are very low-powered here --
    this run is exploratory, not a basis for significance claims, same
    caveat as exp_661.
  - mil_fit/mil_eval (Tiers 1-5) deliberately NOT run for this config --
    only the downstream suite (CVAE, TRTR/TSTR/TSRTR, stats_eval) was
    requested. Revisit if the MIL tiers are wanted for this task too.
  - exp_672 (LGm2 vs rest) / exp_673 (LGm3 vs rest): build the
    corresponding dataset with
    `python scripts/build_glioma_mil_lgm_subtype.py --positive-class {1,2}
    --out data/processed/glioma_mil_lgm{2,3}_vs_rest.h5`, then copy this
    file changing only name/paths/processed_file/description.
