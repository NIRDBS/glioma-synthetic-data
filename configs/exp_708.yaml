# exp_708: TS/TR with a synthetic pool of 40,000 spectra per class (80,000 per fold), decoders of exp_608 (beta=0.5, latent_dim=32, reconstruction=MSE, threshold 0.60)
# See configs/README.md.
name: exp_708
description: "TS/TR with a synthetic pool of 40,000 spectra per class (80,000 per fold), decoders of exp_608 (beta=0.5, latent_dim=32, reconstruction=MSE, threshold 0.60)"
version: "1.0"

paths:
  data_root: "data"
  raw_data_dir: "data/raw"
  calib_file: "data/RamanFreqTable.csv"
  splits_file: "data/splits/manual_splits.json"

  results_root: "results"
  experiment_root: "results/exp_708"
  processed_file: "data/processed/glioma_mil.h5"

  models_baseline_dir: "results/exp_501/models/trtr"   # REUSED
  models_tstr_dir: "results/exp_708/models/tstr"       # OWN -- TSTR on the 2x pool lives here
  models_tsrtr_dir: "results/exp_708/models/tsrtr"     # unused (no tsrtr stage); stats_eval skips it
  models_cvae_dir: "results/exp_608/models/cvae"       # REUSED -- decoders only; never trained here
  synthetic_dir: "results/exp_708/synthetic"           # OWN -- the 2x pool (synth_gen stage output)
  statistical_dir: "results/exp_708/statistical_eval"

pipeline:
  stages: [trtr, synth_gen, tstr, stats_eval]   # no cvae: see header

preprocessing:
  signal_length: 1738
  crop_region: [700, 1800]
  y_tumor: false

augmentation:
  enabled: true
  max_shift: 3
  mixup_alpha: 0.5

cv_strategy:
  split_source: "data/splits/manual_splits.json"
  n_folds: 5
  patient_cap: 500

training:
  random_seed: 42
  verbose: 1

models:
  apollo:
    n_features: 20
    random_state: 42
  random_forest:
    n_estimators: 100
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1
  xgboost:
    objective: "binary:logistic"
    random_state: 42
    n_jobs: -1
    tree_method: "hist"
    num_classes: 2
  cnn:
    input_shape: [null, 1]
    num_classes: 2
    optimizer: "adam"
    loss: "categorical_crossentropy"
    batch_size: 256
    epochs: 200
    early_stopping_patience: 20
    inner_val_fraction: 0.15
    random_state: 42
    dropout_rate: 0.6
    backend: "modal"   # GPU job -- Apollo/RF/XGBoost still train locally (fast on CPU)

  cvae:
    num_classes: 2
    batch_size: 256
    epochs: 120
    learning_rate: 0.001
    latent_dim: 32
    random_state: 42
    reconstruction_loss_mode: "combined"
    loss_weights:
      alpha: 0.2
      beta: 0.5
      gamma: 1.0
      delta: 0.0

    encoder:
      filters: [32, 64, 128]
      kernels: [11, 5, 3]
      strides: [2, 2, 2]
    decoder:
      initial_filters: 128
      filters: [128, 64, 32]
      kernels: [3, 5, 11]
      strides: [2, 2, 2]

    samples_per_class: 40000   # <-- THE CHANGED SETTING (exp_608 has 20000); read by synth_gen only

statistics:
  bootstrap_samples: 1000
  alpha: 0.05
  random_seed: 42

mil:
  pi_floor: 0.02
  svm_subsample_per_bag: 500
  cbr_temperature: 0.001

output:
  output_base: "results"
  include_experiment_name_in_output: true
